<!DOCTYPE html>
<script>

const userId = localStorage.getItem("user_id");

if (!userId) {
  window.location.href = "login.html";
}

</script>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Budget Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>
  Budget Tracker
  <div class="user-info">
  <img
    src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
    class="profile-icon">

  <span id="welcomeText"></span>
</div>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="add.html">Add Transaction</a>
    <a href="transactions.html">Transactions</a>
    <a href="recurring.html">Recurring</a>
    <button onclick="logout()">Logout</button>
  </nav>
</header>
  <div class="card">
    <h3>Monthly Budget Progress</h3>

    <div class="progress-bar">
     <div class="progress-fill" id="progress-fill"></div>
    </div>

    <p id="progress-text">$0 / $0</p>
  </div>
<div class="card">

  <h2>Recent Transactions</h2>

  <div id="recentTransactions"></div>

</div>
<div class="card">
  <h2>Monthly Spending Trends</h2>
  <canvas id="trendChart"></canvas>
</div>
<div class="container">

  <div class="summary">

<div class="card summary-card">
  <h3>Income</h3>
  <p>$<span id="income">0</span></p>
</div>

<div class="card summary-card">
  <h3>Expenses</h3>
  <p>$<span id="expenses">0</span></p>
</div>

<div class="card summary-card">
  <h3>Balance</h3>
  <p>$<span id="balance">0</span></p>
</div>

  </div>

  <div class="card">
    <h2>Spending Breakdown</h2>
    <canvas id="expenseChart"></canvas>
  </div>

</div>

<script>
  function logout() {

  localStorage.removeItem("user_id");

  window.location.href = "login.html";
  }
async function loadDashboard() {
  const userId = localStorage.getItem("user_id");

  const res = await fetch(`http://127.0.0.1:5000/dashboard/${userId}`)
  const data = await res.json();

  const budgetLimit = data.income || 1;

  const percentUsed =
    (data.expenses / budgetLimit) * 100;

  document.getElementById("progress-fill").style.width =
    `${Math.min(percentUsed, 100)}%`;

  document.getElementById("progress-text").innerText =
    `$${data.expenses} spent of $${data.income}`;
   
  const transactionRes = await fetch(
  `http://127.0.0.1:5000/transactions/${userId}`
);

const transactions = await transactionRes.json();

const recentContainer =
  document.getElementById("recentTransactions");

recentContainer.innerHTML = "";

transactions.slice(0, 5).forEach(t => {

  recentContainer.innerHTML += `
    <div class="recent-item">
      <strong>${t.description}</strong>
      <span>$${t.amount}</span>
    </div>
  `;
});

const trendCtx =
  document.getElementById("trendChart")
  .getContext("2d");

new Chart(trendCtx, {

  type: "line",

  data: {

    labels: data.months,

    datasets: [{
      label: "Monthly Expenses",
      data: data.monthly_totals,
      borderWidth: 3,
      tension: 0.4
    }]
  }
});

  const username = localStorage.getItem("username");

  if (username) {
  document.getElementById("welcomeText")
    .innerText = `Welcome, ${username}`;
  }

  document.getElementById("income").innerText = data.income;
  document.getElementById("expenses").innerText = data.expenses;
  document.getElementById("balance").innerText = data.balance;

  const ctx = document.getElementById("expenseChart").getContext("2d");

  new Chart(ctx, {
    type: "pie",
    data: {
      labels: data.categories,
      datasets: [{
        data: data.amounts,
        backgroundColor: [
          "#ff6384",
          "#36a2eb",
          "#ffcd56",
          "#4bc0c0",
          "#9966ff"
        ]
      }]
    }
  });
}

loadDashboard();
</script>

</body>
</html>
