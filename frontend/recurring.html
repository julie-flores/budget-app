<!DOCTYPE html>
<script>

const userId = localStorage.getItem("user_id");

if (!userId) {
  window.location.href = "login.html";
}

</script>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Recurring Transactions</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  Budget Tracker

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="add.html">Add Transaction</a>
    <a href="transactions.html">Transactions</a>
    <a href="recurring.html">Recurring</a>
  </nav>
</header>

<div class="container">

  <div class="card">

    <h2>Add Recurring Transaction</h2>

    <form id="recurringForm">

      <label>Amount</label>
      <input type="number" id="amount" required>

      <label>Type</label>
      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>

      <label>Category</label>
      <select id="category"></select>

      <label>Description</label>
      <input type="text" id="description">

      <label>Frequency</label>
      <select id="frequency">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>

      <button type="submit">
        Add Recurring Transaction
      </button>

    </form>
    <h2>Recurring Transactions</h2>

<table>

  <thead>
    <tr>
      <th>Amount</th>
      <th>Type</th>
      <th>Category</th>
      <th>Description</th>
      <th>Frequency</th>
    </tr>
  </thead>

  <tbody id="recurring-table"></tbody>

</table>

  </div>

</div>

<script>

async function loadCategories() {

  const res = await fetch("http://127.0.0.1:5000/categories");
  const data = await res.json();

  const categorySelect =
    document.getElementById("category");

  data.forEach(category => {

    const option = document.createElement("option");

    option.value = category.category_id;
    option.textContent = category.name;

    categorySelect.appendChild(option);
  });
}

document.getElementById("recurringForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const recurringTransaction = {

    user_id: localStorage.getItem("user_id"),

    amount: document.getElementById("amount").value,

    type: document.getElementById("type").value,

    category_id:
      document.getElementById("category").value,

    description:
      document.getElementById("description").value,

    frequency:
      document.getElementById("frequency").value
  };

  await fetch("http://127.0.0.1:5000/add-recurring", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify(recurringTransaction)
  });

  alert("Recurring Transaction Added!");

});
async function loadRecurringTransactions() {

  const userId = localStorage.getItem("user_id");

  const res = await fetch(
    `http://127.0.0.1:5000/recurring-transactions/${userId}`
  );

  const data = await res.json();

  console.log(data);

  const table =
    document.getElementById("recurring-table");

  table.innerHTML = "";

  data.forEach(t => {

    const row = `
      <tr>
        <td>$${t.amount}</td>
        <td>${t.type}</td>
        <td>${t.category_id}</td>
        <td>${t.description}</td>
        <td>${t.frequency}</td>
      </tr>
    `;

    table.innerHTML += row;
  });
}
loadCategories();
loadRecurringTransactions();

</script>

</body>
</html>
